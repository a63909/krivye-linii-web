name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Verify payment invariants
        run: node --test tests/yookassa.test.mjs
      - name: Build standalone
        run: npm run build
      - name: Verify standalone artifact
        run: test -f .next/standalone/server.js
